[package]
name = "leash"
version = "0.1.0"
edition = "2021"
description = "Spending limits for AI agents, enforced on Solana"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "leash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"

[lints.rust]
unexpected_cfgs = { level = "allow" }
